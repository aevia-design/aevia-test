<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aevia — 3D open-book render harness</title>
<style>
  html,body { margin:0; height:100%; background:#f4f1ea; }
  #scene { width:100vw; height:100vh; display:block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<script src="../assets/js/book-3d-spec.js"></script>
<script src="../assets/Template_Newborn/newborn-data.js"></script>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createOpenBook, studioLighting, groundShadow } from '../assets/js/book-3d-renderer.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f1ea);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

studioLighting(THREE, scene, renderer);

const spec = window.buildBookSpec(window.NEWBORN_DATA);

// PLACEHOLDER spread texture for geometry/pose dev. The REAL texture comes from
// qa/capture-spread.mjs (screenshots the engine's .spread-pages on a live order —
// needs the staff password). When sessions/qa-runs/spread-newborn.png exists we use
// it; otherwise we draw a stand-in two-page layout so the pose can be tuned offline.
function placeholderSpread() {
  const c = document.createElement('canvas');
  c.width = 1204; c.height = 600;
  const x = c.getContext('2d');
  x.fillStyle = '#FDF1E5'; x.fillRect(0, 0, c.width, c.height);          // page cream
  const photos = [
    [60, 220, 320, 300, '#9fb2c4'], [430, 70, 260, 360, '#c9b7a0'],     // left page
    [770, 150, 360, 300, '#b9c6cf'],                                      // right page
  ];
  photos.forEach(([px, py, pw, ph, col]) => { x.fillStyle = col; x.fillRect(px, py, pw, ph); });
  x.fillStyle = '#1c2a4a'; x.font = 'italic 30px Georgia';
  x.fillText('Nicolas', 120, 540);
  return new THREE.CanvasTexture(c);
}

function build(tex) {
  const { book, fit, dims } = createOpenBook(THREE, scene, renderer, spec, tex, window._wrap);
  groundShadow(THREE, scene, new THREE.Box3().setFromObject(book).min.y);
  fit(camera);
  const controls = new OrbitControls(camera, canvas);
  controls.target.set(0, dims.topY * 0.5, 0);
  controls.enableDamping = true;
  window.__three = { THREE, scene, camera, controls, book, renderer };
  window.__ready = true;
  function resize(){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w || canvas.height !== h){ renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  }
  function loop(){ resize(); controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); }
  loop();
}

// The board-rim colour comes from the cover wrap (same as the closed book).
new THREE.TextureLoader().load('../sessions/qa-runs/cover-wrap-newborn.png', (wrap) => {
  window._wrap = wrap;
  new THREE.TextureLoader().load(
    '../sessions/qa-runs/spread-newborn.png',
    (spread) => build(spread),
    undefined,
    () => build(placeholderSpread())   // no real capture yet → placeholder
  );
});
</script>
</body>
</html>
