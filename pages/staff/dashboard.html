<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Aevia</title>
  <style>
    :root {
      --bg:      #fafaf8;
      --surface: #f3efe9;
      --border:  #e4dfd8;
      --text:    #1a1a1a;
      --muted:   #7d7570;
      --accent:  #a8895f;
      --white:   #ffffff;
      --serif:   Georgia, 'Times New Roman', serif;
      --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font: inherit; }

    /* ── Lock screen ── */
    #lock {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .lock-box { width: 340px; text-align: center; }
    .lock-logo { font-family: var(--serif); font-size: 22px; letter-spacing: -0.01em; margin-bottom: 32px; color: var(--text); }
    .lock-title { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
    .lock-input {
      width: 100%; padding: 12px 16px; font-size: 14px; font-family: var(--sans);
      background: var(--white); border: 1px solid var(--border); border-radius: 4px;
      outline: none; margin-bottom: 10px; color: var(--text); transition: border-color 0.15s;
    }
    .lock-input:focus { border-color: var(--text); }
    .pwd-wrap { position: relative; margin-bottom: 10px; }
    .pwd-wrap .lock-input { padding-right: 60px; margin-bottom: 0; }
    .pwd-toggle {
      position: absolute; top: 0; bottom: 0; right: 0;
      padding: 0 14px; border: none; background: none; cursor: pointer;
      font-family: var(--sans); font-size: 12px; color: var(--muted);
      transition: color 0.15s;
    }
    .pwd-toggle:hover { color: var(--text); }
    .lock-btn {
      width: 100%; padding: 12px; background: var(--text); color: var(--white);
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      border-radius: 4px; transition: background 0.15s;
    }
    .lock-btn:hover { background: #333; }
    .lock-error { font-size: 12px; color: #c0392b; margin-top: 10px; min-height: 18px; }

    /* ── App shell ── */
    #app { display: none; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 40px; border-bottom: 1px solid var(--border);
      background: var(--white); position: sticky; top: 0; z-index: 10;
    }
    .topbar-logo { font-family: var(--serif); font-size: 18px; letter-spacing: -0.01em; }
    .topbar-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-left: 14px; }
    .topbar-left { display: flex; align-items: baseline; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .refresh-btn {
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); border: 1px solid var(--border); padding: 7px 16px;
      border-radius: 100px; transition: color 0.15s, border-color 0.15s;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--text); }
    .logout-btn { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); transition: color 0.15s; }
    .logout-btn:hover { color: var(--text); }

    /* ── Stats bar ── */
    .stats { display: flex; border-bottom: 1px solid var(--border); background: var(--white); }
    .stat { flex: 1; padding: 20px 40px; border-right: 1px solid var(--border); }
    .stat:last-child { border-right: none; }
    .stat-num { font-family: var(--serif); font-size: 32px; font-weight: 400; line-height: 1; }
    .stat-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

    /* ── Filters ── */
    .filters { padding: 16px 40px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .filter-btn {
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border);
      color: var(--muted); transition: all 0.15s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--text); }
    .filter-btn.active { background: var(--text); color: var(--white); border-color: var(--text); }

    /* ── Table ── */
    .table-wrap { padding: 0 40px 60px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; min-width: 900px; }
    th {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); font-weight: 400; padding: 10px 16px;
      border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap;
    }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: var(--surface); }

    .order-num { font-weight: 600; font-size: 13px; letter-spacing: 0.03em; }
    .order-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .order-age  { font-size: 11px; color: var(--accent); margin-top: 1px; }
    .customer-name { font-size: 14px; }
    .customer-email { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── Status badge ── */
    .badge {
      display: inline-block; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 3px 9px; border-radius: 100px; font-weight: 500;
    }
    .badge-uploading    { background: #fff7ed; color: #9a3412; }
    .badge-new          { background: #e8f0fe; color: #1a56db; }
    .badge-designing    { background: #fef3c7; color: #92400e; }
    .badge-needs_info   { background: #ffe4e6; color: #9f1239; }
    .badge-review_sent  { background: #e0f2fe; color: #0369a1; }
    .badge-approved     { background: #dcfce7; color: #166534; }
    .badge-paid         { background: #d1fae5; color: #065f46; }
    .badge-sent_to_print{ background: #ede9fe; color: #5b21b6; }
    .badge-printing     { background: #f3e8ff; color: #6b21a8; }
    .badge-in_delivery  { background: #fef9c3; color: #854d0e; }
    .badge-delivered    { background: #f0fdf4; color: #14532d; }

    /* ── Status dropdown ── */
    .status-select {
      font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--white); color: var(--text); cursor: pointer;
      font-family: var(--sans); outline: none; width: 100%;
    }
    .status-cell { min-width: 160px; }

    /* ── Status history tooltip ── */
    .status-history { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.6; }
    .status-history span { display: block; }

    .gcs-link {
      font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent); border-bottom: 1px solid currentColor; padding-bottom: 1px;
    }
    .gcs-link:hover { color: var(--text); }

    .notes-text { font-size: 12px; color: var(--muted); max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Preview link controls ── */
    .preview-link-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px;
    }
    .pdf-links-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .pdf-link-btn {
      font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 5px 10px; border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); background: var(--white); cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .pdf-link-btn:hover { border-color: var(--text); background: var(--surface); }
    .preview-link-btn {
      font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 5px 10px; border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); background: var(--white); cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .preview-link-btn:hover { border-color: var(--text); }
    .preview-link-btn.revoke:hover { background: #ffe4e6; }
    .preview-url {
      font-size: 11px; padding: 4px 8px; background: var(--surface); border-radius: 3px;
      color: var(--accent); word-break: break-all; flex: 1; min-width: 200px;
    }
    .preview-url-copy {
      font-size: 10px; color: var(--muted); cursor: pointer; padding: 2px 6px;
      transition: color 0.15s;
    }
    .preview-url-copy:hover { color: var(--text); }

    /* ── Empty / Loading ── */
    .state-msg { text-align: center; padding: 80px 24px; color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 17px; }
  </style>
</head>
<body>

<!-- ══ LOCK SCREEN ══ -->
<div id="lock">
  <div class="lock-box">
    <div class="lock-logo">aevia</div>
    <div class="lock-title">Internal Dashboard</div>
    <input id="email-input" class="lock-input" type="email"
           placeholder="Email" autocomplete="username"
           onkeydown="if(event.key==='Enter')document.getElementById('pwd-input').focus()" />
    <div class="pwd-wrap">
      <input id="pwd-input" class="lock-input" type="password"
             placeholder="Password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')unlock()" />
      <button type="button" class="pwd-toggle" id="pwd-toggle"
              onclick="togglePwd()" aria-label="Show password">Show</button>
    </div>
    <button class="lock-btn" onclick="unlock()">Log in</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>


<!-- ══ APP ══ -->
<div id="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">aevia</span>
      <span class="topbar-label">Orders</span>
    </div>
    <div class="topbar-right">
      <button class="refresh-btn" onclick="loadOrders()">Refresh</button>
      <button class="logout-btn" onclick="logout()">Log out</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="stat-total">—</div>
      <div class="stat-label">Total orders</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-new">—</div>
      <div class="stat-label">New</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-active">—</div>
      <div class="stat-label">In progress</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-needs">—</div>
      <div class="stat-label">Needs info</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-done">—</div>
      <div class="stat-label">Delivered</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('uploading', this)">Uploading</button>
    <button class="filter-btn" onclick="setFilter('new', this)">New</button>
    <button class="filter-btn" onclick="setFilter('designing', this)">Designing</button>
    <button class="filter-btn" onclick="setFilter('needs_info', this)">Needs info</button>
    <button class="filter-btn" onclick="setFilter('review_sent', this)">Review sent</button>
    <button class="filter-btn" onclick="setFilter('approved', this)">Approved</button>
    <button class="filter-btn" onclick="setFilter('paid', this)">Paid</button>
    <button class="filter-btn" onclick="setFilter('sent_to_print', this)">Sent to print</button>
    <button class="filter-btn" onclick="setFilter('printing', this)">Printing</button>
    <button class="filter-btn" onclick="setFilter('in_delivery', this)">In delivery</button>
    <button class="filter-btn" onclick="setFilter('delivered', this)">Delivered</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table id="orders-table">
      <thead>
        <tr>
          <th>Order</th>
          <th>Customer</th>
          <th>Template</th>
          <th>Pages</th>
          <th>Photos</th>
          <th>Price</th>
          <th>Notes</th>
          <th class="status-cell">Status</th>
          <th>Folder</th>
        </tr>
      </thead>
      <tbody id="orders-body">
        <tr><td colspan="9"><div class="state-msg">Loading orders…</div></td></tr>
      </tbody>
    </table>
  </div>

</div>


<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy, arrayUnion, serverTimestamp, Timestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const firebaseConfig = {
    apiKey:            "AIzaSyAki1W4N3xVvHSTZl77uTVukeiA3yqO1K4",
    authDomain:        "aevia-uploads.firebaseapp.com",
    projectId:         "aevia-uploads",
    storageBucket:     "aevia-uploads.firebasestorage.app",
    messagingSenderId: "677807969667",
    appId:             "1:677807969667:web:b92b02a38bda89161652b6",
    measurementId:     "G-2QZ4MBKG2B"
  };

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const auth = getAuth(app);

  // ── Auth (Firebase Email/Password) ─────────────────────────────────────────
  const GET_PDF_URL_ENDPOINT = 'https://europe-west1-aevia-uploads.cloudfunctions.net/getPdfUrl';
  const MARK_SENT_TO_PRINT_ENDPOINT = 'https://europe-west1-aevia-uploads.cloudfunctions.net/markSentToPrint';

  // Headers for staff Cloud Function calls — sends the current user's Firebase
  // ID token. The function verifies it against the server-side staff allowlist.
  async function staffHeaders() {
    const user = auth.currentUser;
    const token = user ? await user.getIdToken() : '';
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
  }

  window.unlock = async function() {
    const email = document.getElementById('email-input').value.trim();
    const pwd   = document.getElementById('pwd-input').value;
    const errEl = document.getElementById('lock-error');
    errEl.textContent = '';
    try {
      await signInWithEmailAndPassword(auth, email, pwd);
      // onAuthStateChanged handles showing the app + loading orders.
    } catch (err) {
      errEl.textContent = 'Incorrect email or password.';
      document.getElementById('pwd-input').value = '';
    }
  };

  window.togglePwd = function() {
    const input = document.getElementById('pwd-input');
    const btn   = document.getElementById('pwd-toggle');
    const show  = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Hide' : 'Show';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  };

  window.logout = function() {
    signOut(auth).then(() => location.reload());
  };

  // Source of truth for "are we logged in". Firebase persists the session
  // across reloads/restarts by default, so this fires on every page load.
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('lock').style.display = 'none';
      document.getElementById('app').style.display  = 'block';
      loadOrders();
    } else {
      document.getElementById('app').style.display  = 'none';
      document.getElementById('lock').style.display = 'flex';
    }
  });

  // ── Filter state ──────────────────────────────────────────────────────────
  let currentFilter = 'all';
  let allOrders = [];

  window.setFilter = function(status, btn) {
    currentFilter = status;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  };

  // ── Load orders ───────────────────────────────────────────────────────────
  window.loadOrders = async function() {
    const tbody = document.getElementById('orders-body');
    tbody.innerHTML = '<tr><td colspan="9"><div class="state-msg">Loading orders…</div></td></tr>';
    try {
      const q    = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allOrders  = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      updateStats();
      renderTable();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="state-msg">Error loading orders: ${err.message}</div></td></tr>`;
    }
  };

  // ── Stats ─────────────────────────────────────────────────────────────────
  const IN_PROGRESS = ['designing', 'needs_info', 'review_sent', 'approved', 'paid', 'sent_to_print', 'printing', 'in_delivery'];

  function updateStats() {
    let newCount = 0, activeCount = 0, needsCount = 0, doneCount = 0;
    allOrders.forEach(o => {
      if (o.status === 'new')           newCount++;
      else if (o.status === 'uploading') activeCount++;
      else if (o.status === 'needs_info') needsCount++;
      else if (IN_PROGRESS.includes(o.status)) activeCount++;
      else if (o.status === 'delivered') doneCount++;
    });
    document.getElementById('stat-total').textContent  = allOrders.length;
    document.getElementById('stat-new').textContent    = newCount;
    document.getElementById('stat-active').textContent = activeCount;
    document.getElementById('stat-needs').textContent  = needsCount;
    document.getElementById('stat-done').textContent   = doneCount;
  }

  // ── Render table ──────────────────────────────────────────────────────────
  function renderTable() {
    const tbody   = document.getElementById('orders-body');
    const visible = currentFilter === 'all'
      ? allOrders
      : allOrders.filter(o => o.status === currentFilter);

    if (visible.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9"><div class="state-msg">No orders here yet.</div></td></tr>';
      return;
    }

    tbody.innerHTML = visible.map(o => {
      const createdMs = o.createdAt ? o.createdAt.seconds * 1000 : null;
      const dateStr   = createdMs
        ? new Date(createdMs).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' })
        : '—';
      const ageStr    = createdMs ? timeAgo(createdMs) : '';
      const notes     = [o.specialRequests, o.photoNotes].filter(Boolean).join(' · ') || '—';
      const priceRaw  = o.price ? String(o.price).replace(/[€\s]/g, '') : null;
      const price     = priceRaw ? `€ ${priceRaw}` : '—';

      // Last 2 status history entries
      const history   = o.statusHistory || [];
      const recentLog = history.slice(-2).reverse().map(h => {
        const ts = h.timestamp ? new Date(h.timestamp.seconds * 1000).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit' }) : '';
        return `<span>${statusLabel(h.status)}${ts ? ' · ' + ts : ''}</span>`;
      }).join('');

      const allStatuses = ['uploading','new','designing','needs_info','review_sent','approved','paid','sent_to_print','printing','in_delivery','delivered'];

      const previewUrl = o.previewToken
        ? `https://aevia-test.pages.dev/pages/customer-preview.html?token=${esc(o.previewToken)}`
        : null;

      return `<tr>
        <td>
          <div class="order-num">${esc(o.orderNumber)}</div>
          <div class="order-date">${dateStr}</div>
          ${ageStr ? `<div class="order-age">${ageStr}</div>` : ''}
        </td>
        <td>
          <div class="customer-name">${esc(o.customerName)}</div>
          <div class="customer-email"><a href="mailto:${esc(o.email)}">${esc(o.email)}</a></div>
        </td>
        <td>${esc(o.templateName)}</td>
        <td>${esc(String(o.pageCount ?? '—'))}</td>
        <td>${o.fileCount ?? '—'}</td>
        <td>${esc(price)}</td>
        <td>
          <div class="notes-text" title="${esc(notes)}">${esc(notes)}</div>
          <div class="preview-link-row">
            ${previewUrl
              ? `<div class="preview-url">${esc(previewUrl)}</div>
                 <span class="preview-url-copy" onclick="copyToClipboard('${esc(previewUrl).replace(/'/g, "\\'")}')">copy</span>
                 <button class="preview-link-btn revoke" onclick="revokePreviewLink('${esc(o.orderNumber)}')">Revoke</button>`
              : `<button class="preview-link-btn" onclick="generatePreviewLink('${esc(o.orderNumber)}')">Generate preview link</button>`
            }
          </div>
          <div class="pdf-links-row" id="pdf-row-${esc(o.orderNumber)}" style="display:none;margin-top:8px;gap:8px;flex-wrap:wrap;"></div>
          <div class="print-action-row" id="print-action-${esc(o.orderNumber)}" style="margin-top:8px;">
            ${o.status === 'paid'
              ? `<button class="pdf-link-btn" onclick="markSentToPrint('${esc(o.orderNumber)}')">Mark approved for print</button>`
              : (o.status === 'sent_to_print' ? `<span style="font-size:10px;color:var(--muted);">Sent to print</span>` : '')
            }
          </div>
        </td>
        <td class="status-cell">
          <select class="status-select" onchange="updateStatus('${esc(o.orderNumber)}', this.value)">
            ${allStatuses.map(s =>
              `<option value="${s}" ${o.status === s ? 'selected' : ''}>${statusLabel(s)}</option>`
            ).join('')}
          </select>
          ${recentLog ? `<div class="status-history">${recentLog}</div>` : ''}
        </td>
        <td>
          ${o.folderLink
            ? `<a href="${o.folderLink}" target="_blank" rel="noopener" class="gcs-link">Open folder</a>`
            : '—'}
        </td>
      </tr>`;
    }).join('');
    // After rendering, check PDF existence and populate PDF links
    updatePdfLinks();
  }

  // ── Update PDF links (check existence and show/hide) ─────────────────────
  async function updatePdfLinks() {
    const visible = currentFilter === 'all'
      ? allOrders
      : allOrders.filter(o => o.status === currentFilter);

    for (const order of visible) {
      const row = document.getElementById(`pdf-row-${esc(order.orderNumber)}`);
      if (!row) continue;

      // Check both preview and print PDFs
      const pdfLinks = [];
      for (const type of ['preview', 'print']) {
        try {
          const res = await fetch(GET_PDF_URL_ENDPOINT, {
            method: 'POST',
            headers: await staffHeaders(),
            body: JSON.stringify({ orderNumber: order.orderNumber, type }),
          });
          const data = await res.json();
          if (data.url) {
            const label = type === 'preview' ? 'Preview PDF' : 'Print PDF';
            pdfLinks.push(`<button class="pdf-link-btn" onclick="openPdf('${esc(order.orderNumber)}', '${type}')">${label}</button>`);
          }
        } catch (err) {
          console.error(`Error checking ${type} PDF for ${order.orderNumber}:`, err);
        }
      }

      if (pdfLinks.length > 0) {
        row.innerHTML = pdfLinks.join('');
        row.style.display = 'flex';
      }
    }
  }

  // ── Generate preview link ────────────────────────────────────────────────
  window.generatePreviewLink = async function(orderNumber) {
    try {
      const token = crypto.randomUUID();
      const order = allOrders.find(o => o.orderNumber === orderNumber);

      // Send-gate: an incomplete book must never reach the customer. The completeness
      // flag is computed and stored when staff saves in the template engine
      // (assets/js/book-completeness.js). Missing flag = never saved as complete.
      if (!order || order.staffBookComplete !== true) {
        const reasons = (order && order.staffIncompleteReasons && order.staffIncompleteReasons.length)
          ? order.staffIncompleteReasons.join(', ')
          : 'the book has not been saved as complete yet';
        alert(`Can’t send this book yet — ${reasons}.\n\nOpen it in the template engine, complete it, and save before sending the preview link.`);
        return;
      }

      // Capture staff's current book state as immutable snapshot
      const sentSnapshot = {
        bookAssignments: order?.staffBookAssignments || null,
        bookCaptions: order?.staffBookCaptions || null,
        bookSequence: order?.staffBookSequence || null,
        coverCaptionStyles: order?.staffCoverCaptionStyles || null,
        spreadCaptionStyles: order?.staffSpreadCaptionStyles || null,
        sentAt: serverTimestamp()
      };

      await updateDoc(doc(db, 'orders', orderNumber), {
        previewToken: token,
        sentSnapshot: sentSnapshot
      });
      // Update local state
      if (order) {
        order.previewToken = token;
        order.sentSnapshot = sentSnapshot;
      }
      renderTable();
    } catch (err) {
      alert('Could not generate preview link: ' + err.message);
    }
  };

  // ── Revoke preview link ───────────────────────────────────────────────────
  window.revokePreviewLink = async function(orderNumber) {
    try {
      await updateDoc(doc(db, 'orders', orderNumber), {
        previewToken: null
      });
      // Update local state
      const order = allOrders.find(o => o.orderNumber === orderNumber);
      if (order) {
        order.previewToken = null;
      }
      renderTable();
    } catch (err) {
      alert('Could not revoke preview link: ' + err.message);
    }
  };

  // ── Copy to clipboard helper ──────────────────────────────────────────────
  window.copyToClipboard = async function(text) {
    try {
      await navigator.clipboard.writeText(text);
      // Brief visual feedback
      alert('Copied to clipboard!');
    } catch (err) {
      alert('Could not copy: ' + err.message);
    }
  };

  // ── Open PDF (fetch fresh signed URL and open in new tab) ────────────────
  window.openPdf = async function(orderNumber, type) {
    try {
      const res = await fetch(GET_PDF_URL_ENDPOINT, {
        method: 'POST',
        headers: await staffHeaders(),
        body: JSON.stringify({ orderNumber, type }),
      });
      const data = await res.json();
      if (data.url) {
        window.open(data.url, '_blank');
      } else {
        alert('PDF not found. Run the export script first.');
      }
    } catch (err) {
      alert('Could not fetch PDF: ' + err.message);
    }
  };

  // ── Mark order as sent to print (staff approval before hand-off) ──────────
  window.markSentToPrint = async function(orderNumber) {
    const confirmed = confirm(`Mark order ${orderNumber} as approved for print? This cannot be undone.`);
    if (!confirmed) return;

    try {
      const res = await fetch(MARK_SENT_TO_PRINT_ENDPOINT, {
        method: 'POST',
        headers: await staffHeaders(),
        body: JSON.stringify({ orderNumber }),
      });
      const data = await res.json();

      if (res.ok) {
        // Update local state
        const order = allOrders.find(o => o.orderNumber === orderNumber);
        if (order) {
          order.status = 'sent_to_print';
          order.statusHistory = order.statusHistory || [];
          order.statusHistory.push({
            status: 'sent_to_print',
            timestamp: { seconds: Math.floor(Date.now() / 1000) }
          });
        }
        renderTable();
        alert('Order marked as approved for print.');
      } else {
        // Handle error codes
        if (res.status === 409) {
          alert('Error: Order is not in paid status. Status may have changed.');
        } else if (res.status === 403) {
          alert('Error: Not authorised to perform this action.');
        } else {
          alert(`Error: ${data.error || 'Could not mark order as approved for print'}`);
        }
      }
    } catch (err) {
      alert('Could not mark order as approved for print: ' + err.message);
    }
  };

  // ── Update status + log event ─────────────────────────────────────────────
  window.updateStatus = async function(orderNumber, newStatus) {
    try {
      const event = {
        status:    newStatus,
        timestamp: Timestamp.now()
      };
      await updateDoc(doc(db, 'orders', orderNumber), {
        status:        newStatus,
        statusHistory: arrayUnion(event)
      });
      const order = allOrders.find(o => o.orderNumber === orderNumber);
      if (order) {
        order.status = newStatus;
        order.statusHistory = [...(order.statusHistory || []), event];
      }
      updateStats();
      renderTable();
    } catch (err) {
      alert('Could not update status: ' + err.message);
    }
  };

  // ── Helpers ───────────────────────────────────────────────────────────────
  function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function statusLabel(s) {
    const labels = {
      uploading:     'Uploading…',
      new:           'New',
      designing:     'Designing',
      needs_info:    'Needs info',
      review_sent:   'Review sent',
      approved:      'Approved',
      paid:          'Paid',
      sent_to_print: 'Sent to print',
      printing:      'Printing',
      in_delivery:   'In delivery',
      delivered:     'Delivered'
    };
    return labels[s] || s;
  }

  function timeAgo(ms) {
    const diff = Date.now() - ms;
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'today';
    if (days === 1) return '1 day ago';
    if (days < 30)  return `${days} days ago`;
    const months = Math.floor(days / 30);
    return months === 1 ? '1 month ago' : `${months} months ago`;
  }

</script>
